services:
  broker:
    image: redis:7-alpine

  storage:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: db
      POSTGRES_USER: user
      POSTGRES_PASSWORD: pass

  aggregator:
    build: ./aggregator
    ports:
      - "8080:8080"
    depends_on:
      - broker
      - storage
    environment:
      DATABASE_URL: postgresql://user:pass@storage:5432/db

  publisher:
    build: ./publisher
    depends_on:
      - aggregator
